<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dragon Slash — Thumos + Streak</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0b10; overflow: hidden; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: "Georgia", serif; color: #cfcfd6;
  }
  #title { padding: 28px 32px; letter-spacing: .35em; font-size: 13px; opacity: .55; text-transform: uppercase; }
  #hint  { padding: 28px 32px; font-size: 13px; opacity: .45; align-self: flex-end; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui">
  <div id="title">dragon slash &nbsp;·&nbsp; thumos</div>
  <div id="hint">1 / left click — dragon slash &nbsp;·&nbsp; 2 / right click — amakakeru &nbsp;·&nbsp; 3 — instant (all at once)</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.5.2/pixi.min.js"></script>
<script>
// ===========================================================================
// ThumosInterpreter — your engine, unchanged except:
//   - module import removed (PIXI is global here)
//   - one hook added at the top of _playLayer for "type": "streak"
//   - _playStreak method added
// ===========================================================================
function lerp(a, b, t) { return a + (b - a) * t; }

function lerpColor(c1, c2, t) {
  const r1=(c1>>16)&0xff, g1=(c1>>8)&0xff, b1=c1&0xff;
  const r2=(c2>>16)&0xff, g2=(c2>>8)&0xff, b2=c2&0xff;
  return (Math.round(lerp(r1,r2,t))<<16)|(Math.round(lerp(g1,g2,t))<<8)|Math.round(lerp(b1,b2,t));
}

function getColor(stops, t) {
  if (stops.length === 1) return stops[0];
  const seg = (stops.length - 1) * t;
  const i = Math.min(Math.floor(seg), stops.length - 2);
  return lerpColor(stops[i], stops[i+1], seg - i);
}

function parseStops(colorStops) {
  return (colorStops ?? ['#ffffff']).map(c =>
    typeof c === 'string' ? parseInt(c.replace('#', ''), 16) : c
  );
}

class ThumosInterpreter {
  constructor(app) {
    this._app = app;
    this._layers = [];
    this._delayTimers = [];
  }

  play(json, target, owner) {
    const configs = Array.isArray(json) ? json : [json];
    for (const config of configs) {
      const pos = (config.position === 'owner' && owner) ? owner : target;
      const delay = config.delay ?? 0;
      if (delay > 0) {
        const t = setTimeout(() => this._playLayer(config, pos.x, pos.y), delay);
        this._delayTimers.push(t);
      } else {
        this._playLayer(config, pos.x, pos.y);
      }
    }
  }

  _playLayer(json, x, y) {
    if (json.type === 'streak') { this._playStreak(json, x, y); return; }

    const motion   = json.motion ?? null;
    const motionMs = motion ? motion.duration : 0;
    const emitMs   = json.emitDuration ?? (motion ? motionMs : 100);
    const totalMs  = json.duration ?? emitMs + (json.lifetime ?? 0.8) * 2000;

    const ox = json.offsetX ?? 0;
    const oy = json.offsetY ?? 0;
    const container = new PIXI.Container();
    if (!motion) { container.x = x + ox; container.y = y + oy; }
    this._app.stage.addChild(container);

    const particles = [];
    const stops    = parseStops(json.colorStops);
    const autoAngle = (motion && json.emitAngle === 'auto')
      ? Math.atan2(-(motion.dy ?? 0), -(motion.dx ?? 0))
      : (json.angle ?? 0) * Math.PI / 180;
    const angleRad = autoAngle;
    const speed    = json.speed     ?? 0;
    const spread   = json.spread    ?? 50;
    const spreadX  = json.spreadX   ?? spread;
    const spreadY  = json.spreadY   ?? spread;
    const rate     = json.rate      ?? 8;
    const lifetime = json.lifetime  ?? 0.8;
    const gravity  = json.gravity   ?? 40;
    const waveAmp  = json.waveAmp   ?? 0;
    const waveFreq = json.waveFreq  ?? 1;
    const additive = json.additive  ?? false;
    const rotation = json.rotation  ?? false;
    const shape    = json.shape     ?? 'square';
    const drawFns = {
      square: (g, sz, c) => g.rect(-sz/2, -sz/2, sz, sz).fill(c),
      circle: (g, sz, c) => g.circle(0, 0, sz/2).fill(c),
      spark:  (g, sz, c) => g.rect(-sz, -sz*0.15, sz*2, sz*0.3).fill(c),
      star:      (g, sz, c) => g.star(0, 0, 4, sz, sz * 0.4, Math.PI / 4).fill(c),
      snowflake: (g, sz, c) => g.star(0, 0, 6, sz, sz * 0.35, 0).fill(c),
    };
    const drawParticle = drawFns[shape] ?? drawFns.square;

    const getSpawnPos = (elapsedSec) => {
      if (!motion) return { sx: 0, sy: 0 };
      const t = Math.min(elapsedSec / (motionMs / 1000), 1);
      return {
        sx: x + ox + (motion.fromX ?? 0) + (motion.dx ?? 0) * t,
        sy: y + oy + (motion.fromY ?? 0) + (motion.dy ?? 0) * t,
      };
    };

    let head = null;
    if (motion && json.showHead !== false) {
      head = new PIXI.Graphics();
      head.blendMode = additive ? 'add' : 'normal';
      container.addChild(head);
    }

    const interval    = 1 / (rate * 10);
    let emitTimer     = 0;
    let emitElapsed   = 0;
    let elapsed       = 0;
    let last          = performance.now();

    const spawnParticle = (sx, sy) => {
      const sz      = lerp(json.sizeMin ?? 3, json.sizeMax ?? 11, Math.random());
      const vx      = Math.cos(angleRad) * speed + (Math.random() - 0.5) * spreadX;
      const vy      = Math.sin(angleRad) * speed + (Math.random() - 0.5) * spreadY;
      const life    = lifetime * (0.6 + Math.random() * 0.8);
      const rotSpd  = (rotation && shape !== 'spark') ? (Math.random() - 0.5) * 4 : 0;
      const initRot = shape === 'spark' ? Math.atan2(vy, vx) : (rotation ? Math.random() * Math.PI * 2 : 0);

      const g = new PIXI.Graphics();
      drawParticle(g, sz, 0xffffff);
      const baseX = sx + (Math.random() - 0.5) * 6;
      g.x         = baseX;
      g.y         = sy + (Math.random() - 0.5) * 6;
      g.rotation  = initRot;
      g.blendMode = additive ? 'add' : 'normal';
      container.addChild(g);

      const wavePhase = Math.random() * Math.PI * 2;
      particles.push({ g, vx, vy, life, age: 0, sz, rotSpd, baseX, wavePhase });
    };

    const tickerFn = () => {
      const now = performance.now();
      const dt  = Math.min((now - last) * 0.001, 0.05);
      last = now;
      elapsed += dt;

      const emitSec = emitMs / 1000;
      const { sx, sy } = getSpawnPos(elapsed);

      if (head) {
        const headSz = (json.sizeMax ?? 11) * 1.5;
        head.visible = elapsed < motionMs / 1000;
        if (head.visible) {
          head.x = sx; head.y = sy;
          head.clear();
          head.rect(-headSz/2, -headSz/2, headSz, headSz).fill(0xffffff);
        }
      }

      if (elapsed < emitSec) {
        emitTimer += dt;
        while (emitTimer >= interval) {
          emitElapsed += interval;
          const { sx: psx, sy: psy } = getSpawnPos(emitElapsed);
          spawnParticle(psx, psy);
          emitTimer -= interval;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age += dt;
        const t = p.age / p.life;
        if (t >= 1) {
          container.removeChild(p.g);
          p.g.destroy();
          particles.splice(i, 1);
          continue;
        }
        p.vy += gravity * dt;
        p.baseX += p.vx * dt;
        p.g.x = p.baseX + Math.sin(p.age * waveFreq * Math.PI * 2 + p.wavePhase) * waveAmp;
        p.g.y += p.vy * dt;
        p.g.rotation += p.rotSpd * dt;
        p.g.alpha = lerp(1, 0, t);
        p.g.scale.set(lerp(1, 0, t));

        p.g.tint = getColor(stops, t);
      }
    };

    this._app.ticker.add(tickerFn);

    const layer = { container, tickerFn, timer: null };
    layer.timer = setTimeout(() => this._removeLayer(layer), totalMs);
    this._layers.push(layer);
  }

  // ---- streak: the blade-cut layer ---------------------------------------
  _playStreak(json, x, y) {
    const motion = json.motion;
    if (!motion) return;

    const ox = json.offsetX ?? 0, oy = json.offsetY ?? 0;
    const x0 = x + ox + (motion.fromX ?? 0);
    const y0 = y + oy + (motion.fromY ?? 0);
    const dx = motion.dx ?? 0, dy = motion.dy ?? 0;
    const len = Math.hypot(dx, dy) || 1;
    const px = -dy / len, py = dx / len;

    const sweepMs = motion.duration ?? 120;
    const fadeMs  = json.fadeDuration ?? 260;
    const totalMs = sweepMs + fadeMs;

    const stops    = parseStops(json.colorStops ?? ['#dff4ff', '#7fd4ff']);
    const innerCol = stops[0];
    const outerCol = stops[1] ?? stops[0];
    const coreCol  = typeof json.coreColor === 'string'
      ? parseInt(json.coreColor.replace('#', ''), 16)
      : (json.coreColor ?? 0xffffff);
    const wMax  = json.width ?? 24;
    const coreW = json.coreWidth ?? 2;

    const g = new PIXI.Graphics();
    g.blendMode = (json.additive ?? true) ? 'add' : 'normal';
    const container = new PIXI.Container();
    container.addChild(g);
    this._app.stage.addChild(container);

    const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
    let elapsed = 0;
    let last = performance.now();

    const tickerFn = () => {
      const now = performance.now();
      elapsed += Math.min(now - last, 50);
      last = now;

      const sweep = easeOutQuint(Math.min(elapsed / sweepMs, 1));
      const fade  = elapsed <= sweepMs
        ? 1
        : Math.max(0, 1 - (elapsed - sweepMs) / fadeMs);

      const tipX = x0 + dx * sweep, tipY = y0 + dy * sweep;
      const midX = (x0 + tipX) / 2, midY = (y0 + tipY) / 2;
      const w = wMax * fade;

      g.clear();
      g.poly([
        x0, y0,
        midX + px * w, midY + py * w,
        tipX, tipY,
        midX - px * w, midY - py * w,
      ]).fill({ color: outerCol, alpha: 0.22 * fade });
      g.poly([
        x0, y0,
        midX + px * w * 0.38, midY + py * w * 0.38,
        tipX, tipY,
        midX - px * w * 0.38, midY - py * w * 0.38,
      ]).fill({ color: innerCol, alpha: 0.7 * fade });
      g.moveTo(x0, y0).lineTo(tipX, tipY)
        .stroke({ width: coreW, color: coreCol, alpha: 0.95 * fade, cap: 'round' });
    };

    this._app.ticker.add(tickerFn);
    const layer = { container, tickerFn, timer: null };
    layer.timer = setTimeout(() => this._removeLayer(layer), totalMs);
    this._layers.push(layer);
  }

  _removeLayer(layer) {
    clearTimeout(layer.timer);
    this._app.ticker.remove(layer.tickerFn);
    this._app.stage.removeChild(layer.container);
    layer.container.destroy({ children: true });
    this._layers = this._layers.filter(l => l !== layer);
  }

  stop() {
    for (const t of this._delayTimers) clearTimeout(t);
    this._delayTimers = [];
    for (const layer of [...this._layers]) this._removeLayer(layer);
  }
}

// ===========================================================================
// dragon_slash — your full config, untouched, with one streak layer added
// on top using the exact same motion path (fromX/fromY/dx/dy).
// ===========================================================================
const dragonSlash = [
  {
    "type": "streak",
    "name": "blade cut",
    "colorStops": ["#e0f9ff", "#38bdf8"],
    "coreColor": "#ffffff",
    "width": 28,
    "coreWidth": 2,
    "fadeDuration": 420,
    "additive": true,
    "motion": { "fromX": -141, "fromY": 118, "dx": 282, "dy": -236, "duration": 110 }
  },
  {

  {

  },
  {

    "angle": 140,
    "rate": 130,

    "spreadY": 290,

    "colorStops": ["#ffffff", "#ffffff", "#eaffff"]
  }
];

// ===========================================================================
// amakakeru — your dragon_slash plus the second cut (the vacuum strike),
// kept as a completely separate config. dragonSlash above stays untouched.
// ===========================================================================
const amakakeru = [
  {
    "type": "streak",
    "name": "second cut — the vacuum strike",
    "delay": 460,
    "colorStops": ["#ccfbf1", "#2dd4bf"],
    "coreColor": "#ffffff",
    "width": 44,
    "coreWidth": 3,
    "fadeDuration": 520,
    "additive": true,
    "motion": { "fromX": -141, "fromY": 118, "dx": 282, "dy": -236, "duration": 150 }
  },
  ...dragonSlash
];

// ===========================================================================
// dragonSlashInstant — third version: same layers as dragonSlash, but every
// delay stripped so all particles erupt at the same moment as the cut.
// ===========================================================================
const dragonSlashInstant = dragonSlash.map(layer => {
  const { delay, ...rest } = layer;
  return rest;
});

// ===========================================================================
// demo harness
// ===========================================================================
(async () => {
  const app = new PIXI.Application();
  await app.init({
    resizeTo: window,
    background: '#0b0b10',
    antialias: true,
    resolution: Math.min(window.devicePixelRatio || 1, 2),
    autoDensity: true,
  });
  document.body.appendChild(app.canvas);

  const thumos = new ThumosInterpreter(app);

  const trigger = (config, x, y) => thumos.play(config, { x, y });

  app.canvas.addEventListener('pointerdown', e => {
    const config = e.button === 2 ? amakakeru
                 : e.button === 1 ? dragonSlashInstant
                 : dragonSlash;
    trigger(config, e.clientX, e.clientY);
  });
  app.canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    const cx = app.screen.width / 2, cy = app.screen.height / 2;
    if (e.code === 'Space' || e.code === 'Digit1') {
      e.preventDefault();
      trigger(dragonSlash, cx, cy);
    } else if (e.code === 'Digit2') {
      trigger(amakakeru, cx, cy);
    } else if (e.code === 'Digit3') {
      trigger(dragonSlashInstant, cx, cy);
    }
  });

  setTimeout(() => trigger(dragonSlash, app.screen.width / 2, app.screen.height / 2), 500);
})();
</script>
</body>
